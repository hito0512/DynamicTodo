<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DynamicTodo</title>
    <link rel="stylesheet" href="style.css">
    <!--导入jQuery脚本-->
    <script src="static/jquery.min.js"></script>
    <script src="static/marked_4.1.0_marked.min.js"></script>
    <script src="script/main.js" type="module"></script>
    <script>
        // 兜底提示：脚本缺失（压缩包条目损坏）或初始化失败时，不要只留一个空白框
        window.addEventListener('load', function () {
            setTimeout(function () {
                if (window.__taskBoard) return;
                if (document.querySelector('.init-failed-hint')) return;
                var hint = document.createElement('div');
                hint.className = 'init-failed-hint';
                hint.style.cssText = 'margin:8px;padding:10px 14px;font:13px/1.6 sans-serif;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;';
                hint.textContent = '挂件脚本未能启动，请重新安装挂件或更新到最新版本 / '
                    + 'Widget scripts failed to start. Please reinstall the widget or update to the latest version.';
                document.body.appendChild(hint);
            }, 2000);
        });
    </script>
</head>
<body>
    <div class="app"></div>
</body>
</html>
